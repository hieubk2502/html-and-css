<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Ctrl + D  -->
    <!-- or ALT -->
    <!-- codepen.io -->
    <!-- horizontal rule : tạo đường kẻ ngang -->
    <!-- br: break -->
    <!-- u: underline -->
    <hr />
    <p>
      <b>Lorem</b> ipsum dolor sit amet.<br />
      <u>Lorem</u> ipsum dolor sit amet.<br />
      Lorem ipsum <i>dolor</i> sit amet.<br />
      Lorem ipsum dolor sit amet.<br />
    </p>
    <hr />
    <!-- ul: unordered list -->
    <!-- ol: order list -->
    <!-- li: list item -->

    <ul>
      <li>Item1</li>
      <li>Item2</li>
      <li>Item3</li>
    </ul>

    <hr />
    <ol type="A">
      <li>Top1</li>
      <li>Top2</li>
      <li>Top3</li>
    </ol>

    <hr />

    <!-- ul > li *5 {phan tu so $} -->
    <ul>
      <li>phan tu so 1</li>
      <li>phan tu so 2</li>
      <li>phan tu so 3</li>
      <li>phan tu so 4</li>
      <li>phan tu so 5</li>
      <li>phan tu so 6</li>
      <li>phan tu so 7</li>
    </ul>

    <hr />
  </body>
</html>
